# =============================================================================
#  Invoice Keeper — конфиг nginx ВНУТРИ контейнера фронтенда
#  Раздаёт собранную статику React-приложения (SPA).
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml font/woff font/woff2;

    # API при прямом открытии frontend на :3000 должен идти в Go backend.
    # Без этого POST/PATCH/DELETE попадали бы в try_files SPA и могли получать 405.
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age        86400 always;
            add_header Content-Length                0;
            add_header Content-Type                  text/plain;
            return 204;
        }

        proxy_pass              http://backend:8000;
        proxy_http_version      1.1;
        proxy_method            $request_method;
        proxy_pass_request_body on;
        proxy_pass_request_headers on;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;
        proxy_buffering         off;
    }

    # Хэш-собранные ассеты можно кешировать надолго
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кешируем — иначе после деплоя клиенты будут получать старый бандл
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        try_files /index.html =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck фронтенда
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "frontend: ok\n";
    }
}
