# =============================================================================
#  Invoice Keeper — reverse proxy (главный nginx)
# -----------------------------------------------------------------------------
#  Маршрутизация:
#    /api/            -> backend:8000   (включая /api/v1/docs — Swagger)
#    /docs, /redoc   -> backend:8000   (на случай, если Swagger смонтирован без /api)
#    /healthz        -> локальный ответ (healthcheck самого nginx)
#    /               -> frontend:80    (SPA)
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логи с таймстемпами и длительностью запроса
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    server_name_in_redirect off;

    keepalive_timeout  65;
    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml font/woff font/woff2;

    # -------------------------------------------------------------------------
    # Upstream'ы (resolver не нужен: Docker DNS резолвит имена сервисов)
    # -------------------------------------------------------------------------
    upstream backend_upstream {
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:80 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # -------------------------------------------------------------------------
    # Основной сервер
    # -------------------------------------------------------------------------
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        # Security headers (базовый набор)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # -------------------------------------------------------------------------
        # Healthcheck самого reverse proxy
        # -------------------------------------------------------------------------
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "nginx: ok\n";
        }

        # -------------------------------------------------------------------------
        # Swagger / OpenAPI: /api/v1/docs, /api/v1/docs/oauth2-redirect,
        # /api/v1/openapi.json, /api/v1/redoc
        # -------------------------------------------------------------------------
        location /api/v1/docs {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_read_timeout 120s;
        }

        # -------------------------------------------------------------------------
        # Вся остальная API: /api/... -> backend
        # -------------------------------------------------------------------------
        location /api/ {
            # Отвечаем на preflight до proxy_pass: Go backend не регистрирует OPTIONS.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
                add_header Access-Control-Max-Age        86400 always;
                add_header Content-Length                0;
                add_header Content-Type                  text/plain;
                return 204;
            }

            proxy_pass              http://backend_upstream;
            proxy_http_version      1.1;
            proxy_method            $request_method;
            proxy_pass_request_body on;
            proxy_pass_request_headers on;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_set_header        Connection        "";
            proxy_connect_timeout   10s;
            proxy_send_timeout      60s;
            proxy_read_timeout      60s;
            proxy_buffering         off;
        }

        # -------------------------------------------------------------------------
        # Swagger/Redoc на корне (на случай смонтированного /docs без префикса /api)
        # -------------------------------------------------------------------------
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------------------
        # Статика фронтенда (SPA) с fallback на index.html
        # -------------------------------------------------------------------------
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;

            # SPA-fallback выполняет сам frontend (try_files ... /index.html)
            proxy_redirect off;
        }

        # -------------------------------------------------------------------------
        # WebSocket / streaming (чат, live-обновления)
        # -------------------------------------------------------------------------
        location /ws {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
